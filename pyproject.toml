[project]
name = "langraph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ifham Ansari", email = "ifhamansari933@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.3.0",
    "langchain>=1.3.15",
    "langchain-groq>=1.1.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "langgraph-cli[inmem]>=0.4.31",
    "langsmith>=0.11.1",
    "python-dotenv>=1.2.3",
]

[project.scripts]
langraph = "langraph:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "MCP Demo Langchain",
]
